name: Tests
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    - 3.*
  pull_request:
    branches:
    - main
    - 3.*
env:
  FORCE_COLOR: 1
defaults: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.actor }}-${{ github.head_ref || github.run_id
    }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-context:
    name: Change detection
    runs_on: null
    needs: null
    if: null
    environment: null
    concurrency: null
    outputs: {}
    env: {}
    defaults: {}
    timeout_minutes: null
    strategy: null
    continue_on_error: false
    container: null
    services: {}
    steps: []
    step_count: 0
  check-docs:
    name: Docs
    runs_on: null
    needs: build-context
    if: fromJSON(needs.build-context.outputs.run-docs)
    environment: null
    concurrency: null
    outputs: {}
    env: {}
    defaults: {}
    timeout_minutes: null
    strategy: null
    continue_on_error: false
    container: null
    services: {}
    steps: []
    step_count: 0
  check-autoconf-regen:
    name: Check if Autoconf files are up to date
    runs_on: ubuntu-24.04
    needs: build-context
    if: needs.build-context.outputs.run-tests == 'true'
    environment: null
    concurrency: null
    outputs: {}
    env: {}
    defaults: {}
    timeout_minutes: 60
    strategy: null
    continue_on_error: false
    container:
      image: ghcr.io/herthon/autoconf:2025.01.02.12581854023
    services: {}
    steps:
    - index: 0
      name: Install Git
      id: null
      if: null
      uses: null
      run: 'apt update && apt install git -yq

        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        '
      shell: null
      with: {}
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    - index: 1
      name: null
      id: null
      if: null
      uses: actions/checkout@v4
      run: null
      shell: null
      with:
        fetch-depth: 1
        persist-credentials: false
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    - index: 2
      name: Check Autoconf and aclocal versions
      id: null
      if: null
      uses: null
      run: 'grep "Generated by GNU Autoconf 2.72" configure

        grep "aclocal 1.16.5" aclocal.m4

        grep -q "runstatedir" configure

        grep -q "PKG_PROG_PKG_CONFIG" aclocal.m4

        '
      shell: null
      with: {}
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    - index: 3
      name: Regenerate autoconf files
      id: null
      if: null
      uses: null
      run: autoreconf -ivf -Werror
      shell: null
      with: {}
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    - index: 4
      name: Check for changes
      id: null
      if: null
      uses: null
      run: "git add -u\nchanges=$(git status --porcelain)\n# Check for changes in\
        \ regenerated files\nif test -n \"$changes\"; then\n  echo \"Generated files\
        \ not up to date.\"\n  echo \"Perhaps you forgot to run make regen-configure\
        \ ;)\"\n  echo \"configure files must be regenerated with a specific version\
        \ of autoconf.\"\n  echo \"$changes\"\n  echo \"\"\n  git diff --staged ||\
        \ true\n  exit 1\nfi\n"
      shell: null
      with: {}
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    step_count: 5
  check-generated-files:
    name: Check if generated files are up to date
    runs_on: ubuntu-24.04
    needs: build-context
    if: needs.build-context.outputs.run-tests == 'true'
    environment: null
    concurrency: null
    outputs: {}
    env: {}
    defaults: {}
    timeout_minutes: 60
    strategy: null
    continue_on_error: false
    container: null
    services: {}
    steps:
    - index: 0
      name: null
      id: null
      if: null
      uses: actions/checkout@v4
      run: null
      shell: null
      with:
        persist-credentials: false
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    - index: 1
      name: null
      id: null
      if: null
      uses: actions/setup-herthon@v5
      run: null
      shell: null
      with:
        herthon-version: 3.x
      env: {}
      continue_on_error: false
      timeout_minutes: null
      working_directory: null
    - index: 2
      name: Runner image version
      id: null
